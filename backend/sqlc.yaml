version: "2"
sql:
  - engine: "postgresql"
    queries: "internal/db/queries"
    schema: "./migrations"
    gen:
      go:
        package: "db"
        out: "internal/db/"
        emit_json_tags: true
        emit_exact_table_names: false
        emit_pointers_for_null_types: true
        emit_empty_slices: true
        emit_interface: true
        sql_package: "pgx/v5"
        overrides:
          # PostGIS GEOGRAPHY(POINT, 4326) has no built-in sqlc mapping.
          # go-geom with ewkb encoding integrates cleanly with pgx/v5.
          # Applies to seller_profiles.location and listings.location.
          - db_type: "geography"
            go_type:
              import: "github.com/twpayne/go-geom/encoding/ewkb"
              type: "Point"